name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend lint and type checks
        run: |
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          cd backend
          ruff check .
          mypy veridion/contracts.py veridion/documents.py veridion/grounding.py
      - name: Build and start PostgreSQL stack
        run: docker compose up -d --build --wait
      - name: Unit, API, PostgreSQL, security and evaluation tests
        run: |
          cd backend
          python -m pytest -q
      - name: OpenAPI and documentation links
        run: |
          curl --fail http://127.0.0.1:8817/api/openapi.json -o /tmp/veridion-openapi.json
          openapi-spec-validator /tmp/veridion-openapi.json
          python -c 'import json; assert json.load(open("/tmp/veridion-openapi.json")) == json.load(open("docs/api/openapi.json"))'
          python scripts/check_docs.py
      - name: Frontend types, build and browser checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npx playwright install --with-deps chromium
          npm test
      - name: Service logs
        if: failure()
        run: docker compose logs --tail=100

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan current source tree
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.29.0 dir /repo --redact
