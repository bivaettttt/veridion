name: veridion
x-backend: &backend
  image: veridion-backend:local
  build: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://veridion:local_veridion@db/veridion
    VERIDION_OLLAMA_URL: ${VERIDION_OLLAMA_URL:-}
    VERIDION_OLLAMA_MODEL: ${VERIDION_OLLAMA_MODEL:-qwen2.5:3b}
    VERIDION_DEMO: ${VERIDION_DEMO:-1}
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: veridion
      POSTGRES_PASSWORD: local_veridion
      POSTGRES_DB: veridion
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "veridion"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - veridion-db:/var/lib/postgresql/data
  migrate:
    <<: *backend
    command: ["sh", "-ec", "alembic upgrade head && python -m veridion.demo"]
  api:
    <<: *backend
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${VERIDION_API_PORT:-8817}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    <<: *backend
    restart: on-failure
    command: ["python", "-m", "veridion.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VERIDION_WEB_PORT:-3817}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  veridion-db:
